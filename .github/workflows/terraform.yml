name: terraform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform fmt -check -recursive
      # Downloads the provider and checks every resource against its schema.
      # No backend, no credentials, nothing touches an Okta org.
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
